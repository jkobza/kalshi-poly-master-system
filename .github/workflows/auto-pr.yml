name: Auto Pull Request

on:
  push:
    branches:
      - "v1/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create PR into main
    runs-on: ubuntu-latest

    steps:
      - name: Check for existing PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          count="$(gh pr list \
            --repo "$REPO" \
            --head "$BRANCH_NAME" \
            --base main \
            --state open \
            --json number \
            --jq 'length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.existing-pr.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          title="${BRANCH_NAME#v1/}"
          title="${title//-/ }"
          title="${title//_/ }"

          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH_NAME" \
            --title "v1: $title" \
            --body "Automatically opened from \`$BRANCH_NAME\`."
